<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Controlados · El buscador de controles remotos</title>
  <meta name="theme-color" content="#1b2a4e">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icono-180.png">
  <meta name="apple-mobile-web-app-title" content="Controlados">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="modulepreload" href="/busqueda.js">
  <link rel="modulepreload" href="/iconos.js">
</head>
<body>
  <header class="topbar">
    <div class="topbar-contenido">
      <a class="marca" href="#inicio" aria-label="Inicio">
        <span class="logo" data-icono="control"></span>
        <span class="marca-texto">
          <strong class="logo-texto">controlados<span>.com.ar</span></strong>
          <small>El buscador de controles del rubro</small>
        </span>
      </a>
      <button class="boton-salir" id="botonSalir" type="button">
        <span data-icono="salir"></span><span>Salir</span>
      </button>
    </div>
  </header>

  <nav class="tabbar" aria-label="Secciones">
    <a href="#inicio" data-ruta="inicio"><span class="icono-fondo" data-icono="inicio"></span>Inicio</a>
    <a href="#buscar" data-ruta="buscar"><span class="icono-fondo" data-icono="buscar"></span>Buscar</a>
    <a href="#catalogo" data-ruta="catalogo"><span class="icono-fondo" data-icono="catalogo"></span>Catálogo</a>
    <a href="#reemplazos" data-ruta="reemplazos"><span class="icono-fondo" data-icono="reemplazos"></span>Reemplazos</a>
  </nav>

  <main class="contenedor" id="vista">
    <div class="esqueleto titulo"></div>
    <div class="esqueleto fila"></div>
  </main>

  <footer class="pie">
    controlados.com.ar · El buscador de controles remotos del rubro
  </footer>

  <dialog class="visor" id="visor" aria-label="Foto ampliada">
    <div class="visor-contenido">
      <div class="visor-barra">
        <span id="visorTitulo"></span>
        <button type="button" id="visorCerrar" aria-label="Cerrar"><span data-icono="cerrar"></span></button>
      </div>
      <img id="visorImagen" alt="">
    </div>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
