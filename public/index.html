<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Buscador de Controles - RUSSO Electrónica</title>
  <meta name="description" content="Buscador de controles remotos para clientes de RUSSO Electrónica">
  <meta name="theme-color" content="#0057b8">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icono-180.png">
  <meta name="apple-mobile-web-app-title" content="Controles">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="pagina-login">
  <header class="login-cabecera">
    <span class="logo" data-icono="control"></span>
    <strong>RUSSO Electrónica</strong>
    <p>Buscador de controles remotos</p>
  </header>

  <main>
    <form class="login" id="formLogin" novalidate>
      <h1>Ingresá</h1>
      <p class="nota">Exclusivo para clientes. Encontrá el control de cada TV o aire en segundos.</p>

      <label for="dni">Tu DNI</label>
      <input class="campo" id="dni" name="dni" type="text" inputmode="numeric" enterkeyhint="go"
             autocomplete="username" placeholder="Ej: 30123456" required>

      <button class="boton" type="submit" id="botonIngresar">Ingresar</button>
      <p class="mensaje" id="mensaje" role="alert" hidden></p>

      <p class="login-ayuda">¿Todavía no tenés acceso?<br>
        <a href="https://wa.me/543415851441?text=Hola!%20Quiero%20acceso%20al%20buscador%20de%20controles." target="_blank" rel="noopener">Pedilo por WhatsApp</a>
      </p>
    </form>
  </main>

  <footer class="login-pie">RUSSO Electrónica · Santiago 3462, Rosario · WhatsApp 341 585-1441</footer>

  <script type="module" src="/login.js"></script>
</body>
</html>
