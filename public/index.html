<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="description" content="Encontrá qué control lleva cada TV o aire acondicionado en segundos. Gratis para vendedores y técnicos.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Controlados">
  <meta property="og:title" content="Controlados · El buscador de controles remotos">
  <meta property="og:description" content="Encontrá qué control lleva cada TV o aire acondicionado en segundos. Gratis para vendedores y técnicos.">
  <meta property="og:url" content="https://www.controlados.com.ar/">
  <meta property="og:image" content="https://www.controlados.com.ar/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icono-180.png">
  <meta name="apple-mobile-web-app-title" content="Controlados">

<body class="pagina-login">
  <header class="login-cabecera">
    <span class="logo" data-icono="control"></span>
    <div class="logo-grande">controlados<span>.com.ar</span></div>
    <p>El buscador de controles remotos del rubro</p>
  </header>

  <main>
    <form class="login" id="formLogin" novalidate>
      <h1>Ingresá</h1>
      <p class="nota">Para vendedores y técnicos. Encontrá el control de cada TV o aire en segundos.</p>

      <label for="dni">Tu DNI</label>
      <input class="campo" id="dni" name="dni" type="text" inputmode="numeric" enterkeyhint="go"
             autocomplete="username" placeholder="Ej: 30123456" required>

      <button class="boton" type="submit" id="botonIngresar">Ingresar</button>
      <p class="mensaje" id="mensaje" role="alert" hidden></p>

      <p class="login-ayuda">¿Todavía no tenés acceso?<br>
        <a href="https://wa.me/543415851441?text=Hola!%20Quiero%20acceso%20a%20Controlados." target="_blank" rel="noopener">Pedilo por WhatsApp</a>
      </p>
    </form>
  </main>

  <footer class="login-pie">controlados.com.ar · El buscador de controles remotos del rubro</footer>

  <script type="module" src="/login.js"></script>
</body>
</html>
